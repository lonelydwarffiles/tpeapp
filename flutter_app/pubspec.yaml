name: tpe_app
description: TPE Accountability App — Flutter front-end for the native Android TPE app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP networking (replaces OkHttp)
  http: ^1.2.1

  # BLE — Lovense & Pavlok (replaces BleManager / LovenseManager / PavlokManager for the UI layer)
  flutter_blue_plus: ^2.3.4

  # QR scanning (replaces CameraX + ML Kit barcode in PairingActivity)
  mobile_scanner: ^7.2.0

  # Local key-value storage (replaces SharedPreferences in Kotlin repositories)
  shared_preferences: ^2.2.3

  # Encrypted local storage (replaces EncryptedSharedPreferences for PIN / admin credentials)
  flutter_secure_storage: ^10.3.1

  # State management
  provider: ^6.1.2

  # Image picking for task proof photos (replaces ActivityResultContracts.TakePicture)
  image_picker: ^1.1.2

  # App-private on-device file paths for saved reports/media
  path_provider: ^2.1.4

  # In-app playback for saved device videos
  video_player: ^2.9.2

  # Cryptographic utilities (PBKDF2 for Dart-side PIN pre-hashing if needed)
  crypto: ^3.0.3

  # UUID generation
  uuid: ^4.4.0

  # Date / time formatting
  intl: ^0.20.2

  # Health Connect — reads HeartRate and Steps biometric data
  health: ^13.3.1

  # WorkManager — schedules periodic background vitals-sync tasks
  workmanager: ^0.9.0+3

  # Audio recording — used by WebSocketService for the Live Hot Mic feature
  record: ^6.2.1

  # WebRTC — Flutter-side screen sharing and remote control via DataChannel
  flutter_webrtc: ^1.4.1

  # Text-to-Speech synthesis
  flutter_tts: ^4.2.5

  # Audio session / hardware output-route detection (Bluetooth / wired headset)
  audio_session: ^0.2.3
  permission_handler: ^12.0.1
  google_fonts: ^8.1.0

  # ONNX Runtime — runs 320n.onnx detection model on-device
  flutter_onnxruntime: ^1.4.1

  # Image decoding and resizing (used by NudeNetService isolate preprocessing)
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # path_provider_android 2.3.x pulls in jni/jni_flutter native assets that
  # are not packaged into the host app APK in this hybrid build flow.
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true

  assets:
    - assets/320n.onnx
