[versions]
agp                 = "8.6.0"
kotlin              = "2.2.20"
coreKtx             = "1.13.1"
appcompat           = "1.7.0"
material            = "1.12.0"
preference          = "1.2.1"
lifecycle           = "2.8.0"
security-crypto     = "1.1.0-alpha06"
tflite              = "2.16.1"
tflite-support      = "0.4.4"
glide               = "4.16.0"
coil                = "2.6.0"
okhttp              = "4.12.0"
lsposed-api         = "101.0.1"
lsposed-service     = "101.0.0"
coroutines          = "1.8.1"
camerax             = "1.3.3"
mlkit-barcode       = "17.3.0"
workmanager         = "2.9.0"
paho-android-service = "1.1.1"
paho-client          = "1.2.5"
webrtc               = "1.0.45036"
play-services-location = "21.3.0"

[libraries]
# AndroidX
androidx-core-ktx          = { group = "androidx.core",     name = "core-ktx",         version.ref = "coreKtx" }
androidx-appcompat         = { group = "androidx.appcompat", name = "appcompat",        version.ref = "appcompat" }
material                   = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-preference        = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
lifecycle-service          = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-security-crypto   = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }

# TFLite
tflite                     = { group = "org.tensorflow", name = "tensorflow-lite",              version.ref = "tflite" }
tflite-gpu                 = { group = "org.tensorflow", name = "tensorflow-lite-gpu",           version.ref = "tflite" }
tflite-support             = { group = "org.tensorflow", name = "tensorflow-lite-support",       version.ref = "tflite-support" }
tflite-task-vision         = { group = "org.tensorflow", name = "tensorflow-lite-task-vision",  version.ref = "tflite-support" }
tflite-metadata            = { group = "org.tensorflow", name = "tensorflow-lite-metadata",     version.ref = "tflite-support" }

# Image loading
glide                      = { group = "com.github.bumptech.glide", name = "glide",           version.ref = "glide" }
glide-compiler             = { group = "com.github.bumptech.glide", name = "compiler",        version.ref = "glide" }
coil                       = { group = "io.coil-kt",               name = "coil",             version.ref = "coil" }
okhttp                     = { group = "com.squareup.okhttp3",      name = "okhttp",           version.ref = "okhttp" }

# MQTT (Paho)
paho-android-service       = { group = "org.eclipse.paho", name = "org.eclipse.paho.android.service", version.ref = "paho-android-service" }
paho-client                = { group = "org.eclipse.paho", name = "org.eclipse.paho.client.mqttv3", version.ref = "paho-client" }
webrtc                     = { group = "com.infobip", name = "google-webrtc", version.ref = "webrtc" }
play-services-location     = { group = "com.google.android.gms", name = "play-services-location", version.ref = "play-services-location" }

# LSPosed / Xposed
lsposed-api                = { group = "io.github.libxposed", name = "api", version.ref = "lsposed-api" }
lsposed-service            = { group = "io.github.libxposed", name = "service", version.ref = "lsposed-service" }
xposed-api                 = { group = "de.robv.android.xposed", name = "api", version = "82" }

# Coroutines
coroutines-android         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# RenderScript toolkit (Gaussian blur without legacy RS)
renderscript-toolkit       = { group = "io.github.anthonyy232", name = "renderscript-toolkit", version = "1.0.0" }

# CameraX (used by PairingActivity for QR scanner preview)
camera-core                = { group = "androidx.camera", name = "camera-core",      version.ref = "camerax" }
camera-camera2             = { group = "androidx.camera", name = "camera-camera2",   version.ref = "camerax" }
camera-lifecycle           = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view                = { group = "androidx.camera", name = "camera-view",      version.ref = "camerax" }
camera-video               = { group = "androidx.camera", name = "camera-video",     version.ref = "camerax" }

# ML Kit Barcode Scanning (used by PairingActivity to read partner QR codes)
mlkit-barcode-scanning     = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkit-barcode" }

# WorkManager (Adherence audit upload)
workmanager                = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

[plugins]
android-application  = { id = "com.android.application",  version.ref = "agp" }
android-library      = { id = "com.android.library",      version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt          = { id = "org.jetbrains.kotlin.kapt",    version.ref = "kotlin" }
